name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generated parser is up to date
        run: npx tree-sitter generate && git diff --exit-code src
      - name: Built-in lists are up to date
        run: node scripts/update-builtins.mjs --check
      - name: Parser builds
        run: make
      - name: Language server and VS Code extension build
        run: npm run build:vscode
      - run: npm run typecheck
      - run: npm test
      - name: Grammar matches DAPHNE's ANTLR grammar
        run: |
          pip install -r conformance/requirements.txt
          python conformance/check.py "$(conformance/fetch-daphne.sh)"
